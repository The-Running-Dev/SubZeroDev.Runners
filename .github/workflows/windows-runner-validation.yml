name: Windows runner validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  instances:
    name: PowerShell parser and instance regressions
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Parse all PowerShell files and exercise isolated instances
        shell: pwsh
        run: ./tests/Test-WindowsRunnerInstances.ps1
      - name: Verify smoke evidence checker with synthetic job results
        shell: pwsh
        run: ./tests/Test-WindowsRunnerSmokeEvidence.ps1
      - name: Verify BuildAgent acceptance checker with synthetic evidence
        shell: pwsh
        run: ./tests/Test-WindowsRunnerBuildAgentEvidence.ps1
      - name: Verify BuildAgent acceptance dispatch with a fake gh
        shell: pwsh
        run: ./tests/Test-WindowsRunnerBuildAgentDispatch.ps1
      - name: Verify host acceptance against fake clones
        shell: pwsh
        run: ./tests/Test-WindowsHostAcceptance.ps1
      - name: Exercise bootstrap under stock Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-WindowsRunnerBootstrap.ps1
      - name: Verify settings, slot names and runners.host.json layering
        shell: pwsh
        run: ./tests/Test-RunnerSettings.ps1
      - name: Exercise automated host setup with isolated fixtures
        shell: pwsh
        run: ./tests/Test-WindowsRunnerHostSetup.ps1
      - name: Verify resumable automatic setup and controlled lifecycle checks
        shell: pwsh
        run: ./tests/Test-WindowsRunnerAutomaticAcceptance.ps1
      - name: Verify acceptance ownership, interrupted dispatch and stale runner safeguards
        shell: pwsh
        run: ./tests/Test-WindowsRunnerAcceptanceSafeguards.ps1
      - name: Verify intended repository scope before configuring runners
        shell: pwsh
        run: ./tests/Test-WindowsRunnerRepositoryScope.ps1
      - name: Verify Linux job-container mount creation with fake Docker
        shell: pwsh
        run: ./tests/Test-LinuxJobContainerMounts.ps1
      - name: Verify Linux consumer eligibility with fake GitHub inventory
        shell: pwsh
        run: ./scripts/docs-smoke/Test-Eligibility.ps1
      - name: Verify Linux consumer PR and resumable dispatch controller with fake GitHub
        shell: pwsh
        run: ./tests/Test-LinuxDocsSmokeController.ps1
      - name: Exercise BuildAgent provisioning and resumable setup state with fixtures
        shell: pwsh
        run: ./tests/Test-BuildAgentProvisioning.ps1
      - name: Exercise configuration, BuildAgent invocation, registration, drain, housekeeping and Linux image guards
        shell: pwsh
        run: ./tests/Test-RunnerIntegration.ps1
      - name: Exercise failed-stop handling, label recovery state and supervisor recovery (entry points and a real supervisor process)
        shell: pwsh
        run: ./tests/Test-LifecycleRecovery.ps1
      - name: Verify host state, lock, Adopt, Plan and Status
        shell: pwsh
        run: ./tests/Test-HostState.ps1
      - name: Verify automatic start keeps maintenance, Hold and Resume
        shell: pwsh
        run: ./tests/Test-Maintenance.ps1

  linux-smoke-fixtures:
    name: Linux docs smoke fixtures (hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify manual smoke evidence with synthetic artifacts and jobs
        run: node --test scripts/docs-smoke/smoke.test.mjs
      - name: Verify opt-in probe against an external fake Docker executable
        shell: pwsh
        run: ./tests/Test-LinuxJobContainerProbe.ps1
      - name: Verify consumer preparation, dispatch recovery and downloaded-site checks
        shell: pwsh
        run: ./tests/Test-LinuxDocsSmokeController.ps1

