name: Windows runner validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  instances:
    name: PowerShell parser and instance regressions
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Parse all PowerShell files and exercise isolated instances
        shell: pwsh
        run: ./tests/Test-WindowsRunnerInstances.ps1
      - name: Verify smoke evidence checker with synthetic job results
        shell: pwsh
        run: ./tests/Test-WindowsRunnerSmokeEvidence.ps1
      - name: Exercise bootstrap under stock Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-WindowsRunnerBootstrap.ps1
      - name: Exercise automated host setup with isolated fixtures
        shell: pwsh
        run: ./tests/Test-WindowsRunnerHostSetup.ps1
      - name: Verify intended repository scope before configuring runners
        shell: pwsh
        run: ./tests/Test-WindowsRunnerRepositoryScope.ps1
      - name: Exercise BuildAgent provisioning and resumable setup state with fixtures
        shell: pwsh
        run: ./tests/Test-BuildAgentProvisioning.ps1
      - name: Exercise configuration, BuildAgent invocation, registration, drain, housekeeping and Linux image guards
        shell: pwsh
        run: ./tests/Test-RunnerIntegration.ps1
      - name: Exercise failed-stop handling, label recovery state and supervisor recovery (entry points and a real supervisor process)
        shell: pwsh
        run: ./tests/Test-LifecycleRecovery.ps1
